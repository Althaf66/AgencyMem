<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgencyMem</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23facc15'/%3E%3Cpath d='M10 11.5 22.5 10 15.5 22.5Z' fill='none' stroke='%230a0a0a' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='10' cy='11.5' r='3.6'/%3E%3Ccircle cx='22.5' cy='10' r='3.6'/%3E%3Ccircle cx='15.5' cy='22.5' r='3.6'/%3E%3C/svg%3E"
    />
    <script>
      // The saved theme before the first paint, so a light page never flashes dark.
      try {
        if (localStorage.getItem("agencymem.theme") === "light")
          document.documentElement.dataset.theme = "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
